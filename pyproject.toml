[project]
name = "px4-sitl-regression-lab"
version = "0.1.0"
description = "PX4 SITL regression test harness (scenarios + logs + metrics + CI)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Your Name"}]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

