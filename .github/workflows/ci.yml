name: ci

on:
  push:
  pull_request:

jobs:
  sitl-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             git build-essential cmake ninja-build             python3 python3-pip python3-venv             openjdk-17-jre-headless xvfb ccache             ca-certificates
          python3 -m pip install --upgrade pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install python deps
        run: |
          pip install -r requirements.txt

      - name: Run scenarios (headless)
        run: |
          xvfb-run -a bash scripts/ci.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: runs/
