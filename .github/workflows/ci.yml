name: ci

on:
  push:
  pull_request:

jobs:
  sitl-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build pkg-config \
            python3 python3-pip python3-venv \
            openjdk-17-jdk ant xvfb ccache \
            libgl1-mesa-dri libgl1 ca-certificates
          python3 -m pip install --upgrade pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install python deps
        run: |
          pip install -r requirements.txt

      - name: Run trust-layer tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Prepare PX4
        run: |
          PX4_FETCH=1 bash scripts/fetch_px4.sh
          pip install -r external/PX4-Autopilot/Tools/setup/requirements.txt

      - name: Build PX4 SITL
        run: |
          make -C external/PX4-Autopilot px4_sitl_default

      - name: Run scenarios (headless)
        timeout-minutes: 15
        env:
          PX4_SKIP_FETCH: "1"
        run: |
          xvfb-run -a bash scripts/ci.sh

      - name: Check artifact sizes
        if: always()
        run: |
          python3 scripts/check_artifact_sizes.py runs --max-file-mb 50

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: runs/
